<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | Shringar</title>
    <link rel="stylesheet" href="css/shop.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">Shringar</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="#">Wedding Season</a></li>
        <li><a href="#">The Couple Edit</a></li>
        <li><a href="#">Heritage</a></li>
      </ul>
      <div class="nav-icons">❤ 🛒</div>
    </nav>
    <!-- Banner -->
    <section class="shop-banner">
      <h1>Explore Our Collection</h1>
      <p>Discover sarees, jewellery, kurtis and timeless elegance.</p>
    </section>

    <!-- Search -->
    <section class="search-section">
      <input
        type="text"
        id="searchInput"
        placeholder="Search sarees, jewellery, lehengas..."
      />
    </section>

    <section class="shop-tabs">

<h3>Shop By Category</h3>

<div class="tab-buttons">

<button class="filter-btn" data-category="All">
All
</button>

<button class="filter-btn" data-category="Saree">
Sarees
</button>

<button class="filter-btn" data-category="Jewellery">
Jewellery
</button>

<button class="filter-btn" data-category="Lehenga">
Lehengas
</button>

<button class="filter-btn" data-category="Kurti">
Kurtis
</button>

<button class="filter-btn" data-category="Blouse">
Blouses
</button>

<button class="filter-btn" data-category="Couple">
Couple Wear
</button>

</div>

</section>

<section class="shop-tabs">

<h3>Shop By Occasion</h3>

<div class="tab-buttons">

<button class="occasion-btn" data-occasion="All">
All
</button>

<button class="occasion-btn" data-occasion="Haldi">
Haldi
</button>

<button class="occasion-btn" data-occasion="Mehendi">
Mehendi
</button>

<button class="occasion-btn" data-occasion="Sangeet">
Sangeet
</button>

<button class="occasion-btn" data-occasion="Reception">
Reception
</button>

<button class="occasion-btn" data-occasion="Bridal">
Bridal
</button>

</div>

</section>

    <!-- Shop Layout -->
    <section class="shop-container">
      <!-- Filters -->

      <!-- Products -->

      <div id="productContainer" class="product-grid"></div>
    </section>

    <script src="js/products.js"></script>
    <script src="js/shop.js"></script>
  </body>
</html>
