<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop | Shringar</title>

  <link rel="stylesheet" href="css/shop.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Shringar</div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="#">Wedding Season</a></li>
      <li><a href="#">The Couple Edit</a></li>
      <li><a href="#">Heritage</a></li>
    </ul>

    <div class="nav-icons">
      ❤ 🛒
    </div>
  </nav>

  <!-- Banner -->

  <section class="shop-banner">

    <h1>Explore Our Collection</h1>

    <p>
      Discover sarees, jewellery, kurtis and timeless elegance.
    </p>

  </section>

  <!-- Search -->

  <section class="search-section">

    <input
      type="text"
      id="searchInput"
      placeholder="Search products...">

  </section>

  <!-- Shop Layout -->

  <section class="shop-container">

    <!-- Filters -->

    <aside class="filters">

      <h3>Categories</h3>

      <label>
        <input type="checkbox">
        Sarees
      </label>

      <label>
        <input type="checkbox">
        Jewellery
      </label>

      <label>
        <input type="checkbox">
        Lehengas
      </label>

      <label>
        <input type="checkbox">
        Kurtis
      </label>

      <label>
        <input type="checkbox">
        Blouses
      </label>

    </aside>

    <!-- Products -->

    <div id="productContainer" class="product-grid">

    </div>

  </section>

  <script src="js/products.js"></script>
  <script src="js/shop.js"></script>

</body>
</html>
